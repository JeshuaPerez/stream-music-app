<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart | MusicStream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="../assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    
</head>

<body>

<header class="header">
    <div class="logo">
        <a href="index.html">MusicStream</a>
    </div>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="cart.html">Cart</a>
    </nav>
     <div class="avatar">
        <img src="assets/Perfil.jpeg" alt="User profile">
    </div>
</header>


<main class="cart-layout">

    <!-- CART ITEMS -->
    <section class="cart-items">

        <h1>Your Cart</h1>

        <div class="cart-item">
            <img src="assets/High Voltage__(1976).jpeg" alt="Album">

            <div class="item-info">
                <h3>High Voltage</h3>
                <p>$9.99</p>
            </div>

            <p class="item-qty">Qty: 1</p>


            <button class="remove-btn">🗑</button>
        </div>

    </section>

    <!-- ORDER SUMMARY -->
    <aside class="cart-summary">

        <h2>High Voltage, AC/DC</h2>

        <div class="summary-row">
            <span>Subtotal</span>
            <span>$9.99</span>
        </div>

        <div class="summary-row">
            <span>Tax</span>
            <span>$1.00</span>
        </div>

        <div class="summary-total">
            <span>Total</span>
            <span>$10.99</span>
        </div>

        <a href="checkout.html" class="btn-primary checkout-btn">
            Proceed to Checkout
        </a>

    </aside>

</main>

</body>
</html>
