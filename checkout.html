<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart | MusicStream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    
</head>

<header class="header">
    <div class="logo">
        <a href="index.html">MusicStream</a>
    </div>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="album-detail.html">Album</a>
        <a href="player.html">Player</a>
        <a href="cart.html">Cart</a>
        <a href="profile.html">Library</a>
    </nav>
     <div class="avatar">
        <img src="assets/Perfil.jpeg" alt="User profile">
    </div>
</header>


<main class="checkout-container">

    <!-- LEFT SIDE -->
    <section class="checkout-form">

        <!-- PAYMENT METHOD -->
        <div class="checkout-section">
            <h2>Payment Method</h2>

            <div class="payment-options">
                <label class="payment-card">
                    <input type="radio" name="payment" checked>
                    <span>Visa</span>
                </label>

                <label class="payment-card">
                    <input type="radio" name="payment">
                    <span>Mastercard</span>
                </label>

                <label class="payment-card">
                    <input type="radio" name="payment">
                    <span>American Express</span>
                </label>
            </div>

            <div class="form-group">
                <input type="text" placeholder="Card Number">
            </div>

            <div class="form-row">
                <input type="text" placeholder="MM/YY">
                <input type="text" placeholder="CVV">
            </div>
        </div>

        <!-- BILLING ADDRESS -->
        <div class="checkout-section">
            <h2>Billing Address</h2>

            <div class="form-group">
                <input type="text" placeholder="Full Name">
            </div>

            <div class="form-group">
                <input type="text" placeholder="Address">
            </div>

            <div class="form-row">
                <input type="text" placeholder="City">
                <input type="text" placeholder="Postal Code">
            </div>

            <div class="form-group">
                <input type="text" placeholder="Country">
            </div>
        </div>

    </section>

    <!-- RIGHT SIDE SUMMARY -->
    <aside class="checkout-summary">

        <h3>Order Summary</h3>

        <div class="summary-item">
    <img src="assets/High Voltage__(1976).jpeg" alt="Album Cover">

    <div class="summary-info">
        <p>High Voltage</p>
        <small>Digital Album</small>
    </div>

    <span>$9.99</span>
</div>


        <div class="summary-item">
            <p>Let There Be Rock</p>
            <span>$9.99</span>
        </div>

        <hr>

        <div class="summary-total">
            <p>Total</p>
            <span>$19.98</span>
        </div>

        <button class="btn-primary place-order">
            Place Order
        </button>

    </aside>

</main>

</body>
</html>
