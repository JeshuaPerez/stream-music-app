<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Now Playing | MusicStream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
<header class="header">
    <div class="logo">
        <a href="index.html">MusicStream</a>
    </div>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="cart.html">Cart</a>
    </nav>
     <div class="avatar">
        <img src="assets/Perfil.jpeg" alt="User profile">
    </div>
</header>


<main class="player-layout">

    <!-- LEFT SIDE: MAIN PLAYER -->
    <section class="player-main">

        <div class="player-cover">
            <img src="assets/High Voltage__(1976).jpeg" alt="Now Playing Cover">
        </div>

        <h1>Starlight Rush</h1>
        <h2>Solar Flare</h2>

        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress"></div>
        </div>

        <!-- Controls -->
        <div class="player-controls">
            <button>⤮</button>
            <button>⏮</button>
            <button class="play-btn">▶</button>
            <button>⏭</button>
            <button>⟳</button>
        </div>

        <!-- Volume -->
        <div class="volume-control">
            <input type="range">
        </div>

    </section>

    <!-- RIGHT SIDE: UP NEXT -->
    <aside class="up-next">

        <h3>Up Next</h3>

      <ul class="upnext-list">

    <li class="upnext-item">
        <img src="assets/High Voltage__(1976).jpeg" alt="Nebula Dreams">
        <div>
            <span class="track-number">2.</span>
            <span class="track-title">Nebula Dreams</span>
        </div>
    </li>

    <li class="upnext-item">
        <img src="assets/High Voltage__(1976).jpeg" alt="Galactic Pulse">
        <div>
            <span class="track-number">3.</span>
            <span class="track-title">Galactic Pulse</span>
        </div>
    </li>

    <li class="upnext-item">
        <img src="assets/High Voltage__(1976).jpeg" alt="Lunar Drift">
        <div>
            <span class="track-number">4.</span>
            <span class="track-title">Lunar Drift</span>
        </div>
    </li>

    <li class="upnext-item">
        <img src="assets/High Voltage__(1976).jpeg" alt="Cosmic Horizon">
        <div>
            <span class="track-number">5.</span>
            <span class="track-title">Cosmic Horizon</span>
        </div>
    </li>

</ul>


    </aside>

</main>

</body>
</html>
