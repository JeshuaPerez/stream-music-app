<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Now Playing | MusicStream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
<header class="header">
    <div class="logo">
        <a href="index.html">MusicStream</a>
    </div>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="album-detail.html">Album</a>
        <a href="player.html">Player</a>
        <a href="cart.html">Cart</a>
        <a href="profile.html">Library</a>
    </nav>
     <div class="avatar">
        <img src="assets/Perfil.jpeg" alt="User profile">
    </div>
</header>


<main class="player-layout">

    <!-- LEFT SIDE: MAIN PLAYER -->
    <section class="player-main">

        <div class="player-cover">
            <img src="assets/High Voltage__(1976).jpeg" alt="Now Playing Cover">
        </div>

        <h1>AC/DC</h1>
        <h2>High Voltage</h2>

        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress"></div>
        </div>

        <!-- Controls -->
        <div class="player-controls">
            <button>⤮</button>
            <button>⏮</button>
            <button class="play-btn">▶</button>
            <button>⏭</button>
            <button>⟳</button>
        </div>

        <!-- Volume -->
        <div class="volume-control">
            <input type="range">
        </div>

    </section>

    <!-- RIGHT SIDE: UP NEXT -->
    <aside class="up-next">

        <h3>Up Next</h3>

      <ul class="upnext-list">

    <li class="upnext-item">
        <img src="assets/High Voltage__(1976).jpeg" alt="Nebula Dreams">
        <div>
            <span class="track-number">2.</span>
            <span class="track-title">It's a Long Way to the Top (If You Wanna Rock 'n' Roll)</span>
        </div>
    </li>

    <li class="upnext-item">
        <img src="assets/High Voltage__(1976).jpeg" alt="Galactic Pulse">
        <div>
            <span class="track-number">3.</span>
            <span class="track-title">Rock N Roll Singer</span>
        </div>
    </li>

    <li class="upnext-item">
        <img src="assets/High Voltage__(1976).jpeg" alt="Lunar Drift">
        <div>
            <span class="track-number">4.</span>
            <span class="track-title">T.N.T</span>
        </div>
    </li>

    <li class="upnext-item">
        <img src="assets/High Voltage__(1976).jpeg" alt="High Voltage album cover">
        <div>
            <span class="track-number">5.</span>
            <span class="track-title">High Voltage</span>
        </div>
    </li>

</ul>


    </aside>

</main>

</body>
</html>
