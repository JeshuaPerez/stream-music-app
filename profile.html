<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Music - MusicStream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="../assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

<header class="header">

    <div class="header-left">
        <h1 class="logo">
            <a href="index.html">MusicStream</a>
        </h1>
    </div>

    <nav class="nav-links">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>

    <div class="header-right">
        <div class="avatar">
            <img src="assets/Perfil.jpeg" alt="User profile">
        </div>
    </div>

</header>


<main class="profile-layout">

    <!-- SIDEBAR -->
    <aside class="library-sidebar">

        <h2>My Library</h2>

        <ul>
            <li class="active">Recently Purchased</li>
            <li>My Albums</li>
            <li>Liked Songs</li>
        </ul>

    </aside>

    <!-- CONFIRMATION CONTENT -->
    <section class="confirmation-section">

        <div class="confirmation-card">

            <h1>Purchase Successful </h1>

            <p>Thank you for your purchase. Your music is now available in your library.</p>

            <div class="transaction-summary">

                <div class="summary-item">
                    <img src="assets/High Voltage__(1976).jpeg" alt="Album Cover">

                    <div class="summary-info">
                        <p>Cosmic Echoes</p>
                        <small>Digital Album</small>
                    </div>

                    <span>$9.99</span>
                </div>

                <div class="summary-total">
                    <p>Total Paid</p>
                    <span>$9.99</span>
                </div>

            </div>

            <a href="index.html" class="btn-primary">
                Back to Store
            </a>

        </div>

    </section>

</main>

</body>
</html>
